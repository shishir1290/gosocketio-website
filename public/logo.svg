<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="logo-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="logo-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="logo-intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#logo-bg)" stroke="url(#logo-border)" stroke-width="2.5" />

  <!-- Ambient background glow -->
  <circle cx="64" cy="64" r="36" fill="#00f2fe" opacity="0.14" filter="url(#logo-glow)" />
  <circle cx="78" cy="64" r="26" fill="#818cf8" opacity="0.14" filter="url(#logo-glow)" />

  <!-- The "G" Outer Orbital Track -->
  <path
    d="M 88 44
       A 38 38 0 1 0 88 84
       L 88 74
       A 28 28 0 1 1 88 54"
    fill="none"
    stroke="url(#logo-cyan-purple)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The "G" Crossbar & Socket Port -->
  <path
    d="M 60 64 L 94 64"
    stroke="url(#logo-cyan-purple)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- High-Energy Lightning / Real-Time Pulse Bolt -->
  <path
    d="M 67 36 L 55 60 L 69 60 L 59 90 L 81 56 L 69 56 Z"
    fill="url(#logo-spark)"
    filter="url(#logo-intense-glow)"
    opacity="0.95"
  />

  <!-- Realtime Socket Connection Nodes -->
  <circle cx="96" cy="42" r="5" fill="#00f2fe" filter="url(#logo-glow)" />
  <circle cx="96" cy="86" r="5" fill="#a855f7" filter="url(#logo-glow)" />
  <circle cx="106" cy="64" r="3.5" fill="#38bdf8" opacity="0.9" />
</svg>
